services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: planner-app
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: development
    volumes:
      # Mount source for live reload, but keep container's node_modules/.next
      - .:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    restart: unless-stopped
