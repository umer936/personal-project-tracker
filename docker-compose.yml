services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: planner-app
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: production
    volumes:
      # Persist the JSON data store on the host; no source bind-mount so the
      # production build inside the image stays intact (avoids HMR/reload loops).
      - ./data:/app/data
    restart: unless-stopped
